<!DOCTYPE html>

<html lang="pt-pt">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Barra de Carregamento Red Neon - Sincronizada</title>

    

    <style>

        body {

            background-color: #000;

            display: flex;

            justify-content: center;

            align-items: center;

            min-height: 100vh;

            margin: 0;

            overflow: hidden;

            font-family: 'Inter', sans-serif;

            position: relative;

        }



        /* Efeito de Plasma no Fundo */

        #plasmaCanvas {

            position: absolute;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            z-index: -1;

            filter: blur(45px);

            opacity: 0.5;

        }



        .loading-container {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            width: fit-content;

            max-width: 95vw;

            text-align: center;

            position: relative;

            z-index: 1;

            padding: 100px 140px 40px 140px; 

            overflow: visible; 

        }



        /* --- ESTILO IMPACT --- */

        .title {

            font-family: 'Impact', 'Arial Black', sans-serif;

            font-size: clamp(2.5rem, 11vw, 5.5rem);

            font-weight: 900;

            text-transform: uppercase;

            letter-spacing: 1px;

            

            background: linear-gradient(to bottom, 

                #ff9999 0%,    

                #ff0000 45%,   

                #cc0000 50%,   

                #660000 100%); 

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;

            -webkit-text-stroke: 2px #000;

            

            filter: drop-shadow(0 0 12px rgba(255, 0, 0, 0.8)) 

                    drop-shadow(4px 4px 0px #000);



            margin: 0 0 20px 0;

            white-space: nowrap;

            position: relative;

            z-index: 10; 

        }



        .title::after {

            content: '_';

            display: inline-block;

            animation: blink 0.7s infinite;

            -webkit-text-fill-color: #ff0000;

            -webkit-text-stroke: 1px #000;

            filter: drop-shadow(0 0 5px #ff0000);

        }



        .title.typing-done::after {

            display: none;

        }



        .progress-wrapper {

            position: relative;

            width: 100%;

            opacity: 1;

            visibility: visible;

            z-index: 1; 

        }

        

        .emoji {

            width: clamp(14rem, 45vw, 22rem); 

            height: clamp(14rem, 45vw, 22rem);

            position: absolute;

            top: -140px; 

            left: 0;

            z-index: 5; 

            transition: opacity 0.5s ease; 

            animation: bobbing 4s ease-in-out infinite;

            pointer-events: none;

            will-change: left;

        }



        .emoji.shake {

            animation: violent-shake 0.1s linear infinite !important;

        }



        .emoji img {

            width: 100%;

            height: 100%;

            object-fit: contain;

            animation: spin 3s linear infinite;

        }

        

        .emoji.shake img {

            animation: none;

        }



        .progress-bar-container {

            width: 100%;

            height: 48px;

            background-color: rgba(60, 0, 0, 0.4);

            border-radius: 25px;

            overflow: visible;

            position: relative;

            box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);

            z-index: 4; 

            border: 2px solid #111;

        }



        .progress-bar-fill {

            height: 100%;

            width: 0%;

            background: linear-gradient(180deg, 

                #ff9999 0%, 

                #ff0000 40%, 

                #cc0000 60%, 

                #660000 100%);

            border-radius: 25px;

            transition: none; 

            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.3), 

                        0 0 25px #ff0000;

            will-change: width;

        }



        .hidden { display: none; }



        .explode-out {

            transform: scale(2.5);

            opacity: 0;

            transition: transform 1s ease, opacity 1s ease;

        }



        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        @keyframes bobbing {

            0%, 100% { transform: translateY(0px); }

            50% { transform: translateY(30px); }

        }

        

        @keyframes violent-shake {

            0% { transform: translate(0, 0) rotate(0deg); }

            15% { transform: translate(-25px, 18px) rotate(-10deg); }

            35% { transform: translate(25px, -18px) rotate(10deg); }

            55% { transform: translate(-25px, -18px) rotate(-6deg); }

            75% { transform: translate(25px, 18px) rotate(6deg); }

            100% { transform: translate(0, 0) rotate(0deg); }

        }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    </style>

</head>

<body>



    <canvas id="plasmaCanvas"></canvas>



    <div class="loading-container">

        <h1 class="title" id="title"></h1>



        <div class="progress-wrapper hidden" id="progressWrapper">

            <div class="emoji" id="emoji">

                <img src="https://i.ibb.co/qYv8hc3K/Chat-GPT-Image-20-de-dez-de-2025-15-18-32.png" alt="Graphic Image" onerror="this.src='https://via.placeholder.com/300/ff0000/ffffff?text=NEON'">

            </div>



            <div class="progress-bar-container" id="progressBarContainer">

                <div class="progress-bar-fill" id="progressBar"></div>

            </div>

        </div>

    </div>



    <script>

        document.addEventListener('DOMContentLoaded', () => {

            const canvas = document.getElementById('plasmaCanvas');

            const ctx = canvas.getContext('2d');

            const titleElement = document.getElementById('title');

            const progressWrapper = document.getElementById('progressWrapper');

            const emoji = document.getElementById('emoji');

            const progressBar = document.getElementById('progressBar');

            const progressBarContainer = document.getElementById('progressBarContainer');



            // --- PLASMA BACKGROUND ---

            let width, height;

            let blobs = [];

            function resize() {

                width = canvas.width = window.innerWidth;

                height = canvas.height = window.innerHeight;

            }

            class Blob {

                constructor() {

                    this.x = Math.random() * width;

                    this.y = Math.random() * height;

                    this.radius = Math.random() * 150 + 120;

                    this.vx = (Math.random() - 0.5) * 1.5;

                    this.vy = (Math.random() - 0.5) * 1.5;

                }

                update() {

                    this.x += this.vx; this.y += this.vy;

                    if (this.x < -this.radius) this.x = width + this.radius;

                    if (this.x > width + this.radius) this.x = -this.radius;

                    if (this.y < -this.radius) this.y = height + this.radius;

                    if (this.y > height + this.radius) this.y = -this.radius;

                }

                draw() {

                    const gradient = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.radius);

                    gradient.addColorStop(0, 'rgba(255, 255, 255, 0.35)');

                    gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

                    ctx.fillStyle = gradient;

                    ctx.beginPath(); ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2); ctx.fill();

                }

            }

            function initPlasma() {

                resize(); blobs = [];

                for (let i = 0; i < 8; i++) blobs.push(new Blob());

            }

            function animatePlasma() {

                ctx.clearRect(0, 0, width, height);

                blobs.forEach(b => { b.update(); b.draw(); });

                requestAnimationFrame(animatePlasma);

            }

            window.addEventListener('resize', resize);

            initPlasma(); animatePlasma();



            // --- LOADING LOGIC ---

            const fullText = "MOMENT BEFORE TWIST";

            let charIndex = 0;

            function typeText() {

                if (charIndex < fullText.length) {

                    titleElement.textContent += fullText.charAt(charIndex);

                    charIndex++;

                    setTimeout(typeText, 100);

                } else {

                    titleElement.classList.add('typing-done');

                    startLoadingAnimation();

                }

            }



            function startLoadingAnimation() {

                progressWrapper.classList.remove('hidden');



                // posição inicial garantida

                emoji.style.left = '0px';

                emoji.style.opacity = '1';



                setTimeout(() => {

                    animatePerfectly();

                }, 500);

            }



            function animatePerfectly() {

                const totalDuration = 30000;

                const startTime = performance.now();

                let isShaking = false;



                function update(currentTime) {

                    const elapsed = currentTime - startTime;

                    let timeProgress = elapsed / totalDuration;

                    if (timeProgress > 1) timeProgress = 1;



                    // Curva de progresso (ease-out expo 6) - mesma para os dois

                    const curveProgress = 1 - Math.pow(1 - timeProgress, 6.0);



                    const containerWidth = progressBarContainer.clientWidth; // mais consistente

                    const emojiWidth = emoji.offsetWidth;



                    // largura real do preenchimento (ponta do fill)

                    const fillPx = curveProgress * containerWidth;



                    // posição máxima para encostar na quina FINAL (direita)

                    const finalPos = containerWidth - emojiWidth;



                    // A borda direita do emoji encosta EXATAMENTE na ponta do fill:

                    // left = fillPx - emojiWidth (clamp 0..finalPos)

                    let currentEmojiLeft = fillPx - emojiWidth;

                    if (currentEmojiLeft < 0) currentEmojiLeft = 0;

                    if (currentEmojiLeft > finalPos) currentEmojiLeft = finalPos;



                    const emojiEdge = currentEmojiLeft + emojiWidth;

                    emoji.style.left = currentEmojiLeft + 'px';

 codex/increase-image-trembling-effect-rp2jll
                    progressBar.style.width = emojiEdge + 'px';

                    progressBar.style.width = fillPx + 'px';
main



                    // tremor nos últimos 15%

                    if (timeProgress >= 0.85 && !isShaking) {

                        isShaking = true;

                        emoji.classList.add('shake');

                    }



                    if (timeProgress < 1) {

                        requestAnimationFrame(update);

                    } else {

                        // FORÇA FINAL ABSOLUTO

                        progressBar.style.width = containerWidth + 'px';

                        emoji.style.left = finalPos + 'px';



                        setTimeout(() => {

                            titleElement.classList.add('explode-out');

                            progressWrapper.classList.add('explode-out');

                        }, 1500);

                    }

                }



                requestAnimationFrame(update);

            }



            typeText();

        });

    </script>

</body>

</html>
